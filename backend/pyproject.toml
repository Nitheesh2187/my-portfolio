[project]
name = "portfolio-backend"
version = "0.1.0"
description = "Portfolio AI agent — serverless Python backend on Vercel"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "groq>=0.12.0",
    "pydantic>=2.0.0",
]

[project.scripts]
app = "api.index:app"
